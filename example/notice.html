<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>重要信息通报 · 手机编辑</title>
    <!-- Supabase 客户端 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body {
            background: linear-gradient(145deg, #f0f5fe 0%, #dce6f2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .notice-card {
            max-width: 900px;
            width: 100%;
            background: rgba(255,255,255,0.60);
            backdrop-filter: blur(16px);
            border-radius: 56px;
            padding: 45px 50px 50px;
            box-shadow: 0 30px 60px -12px rgba(0,20,40,0.30);
            border: 1px solid rgba(255,255,255,0.25);
        }
        .notice-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 32px;
        }
        .notice-header h1 {
            font-size: 2.6rem;
            font-weight: 500;
            color: #0b1f34;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .notice-header h1 i { color: #b45309; }
        .status-badge {
            background: rgba(20,45,75,0.85);
            color: white;
            padding: 8px 20px;
            border-radius: 60px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-badge i { font-size: 1.2rem; }
        .notice-body {
            background: rgba(255,255,255,0.35);
            border-radius: 40px;
            padding: 30px;
            border-left: 8px solid #b45309;
            min-height: 150px;
            margin-bottom: 28px;
        }
        #noticeContent {
            font-size: 2.2rem;
            line-height: 1.6;
            color: #0a1e32;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .notice-footer {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            border-top: 1px solid rgba(0,0,0,0.05);
            padding-top: 28px;
        }
        .notice-tip {
            color: #2a4b6e;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .notice-tip i { color: #1e6b3b; }
        .back-home {
            background: rgba(255,255,255,0.5);
            color: #1a3552;
            border: 1px solid rgba(255,255,255,0.5);
            padding: 10px 24px;
            border-radius: 60px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .back-home:active { transform: scale(0.94); }

        /* 手机编辑面板 */
        .mobile-editor {
            display: none;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px dashed rgba(0,0,0,0.1);
        }
        .mobile-editor.visible { display: block; }
        .mobile-editor h3 {
            font-size: 1.2rem;
            color: #0b1f34;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .mobile-editor h3 i { color: #059669; }
        .mobile-editor textarea {
            width: 100%;
            padding: 16px 20px;
            font-size: 1.2rem;
            border-radius: 20px;
            border: 2px solid rgba(0,0,0,0.1);
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(4px);
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        .mobile-editor textarea:focus { outline: none; border-color: #1a2e4a; }
        .mobile-editor .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 14px;
            flex-wrap: wrap;
        }
        .mobile-editor .btn-row button {
            padding: 12px 32px;
            border-radius: 60px;
            border: none;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 10px;
            touch-action: manipulation;
        }
        .mobile-editor .btn-row button:active { transform: scale(0.94); }
        .btn-save { background: #1a2e4a; color: white; }
        .btn-save:active { background: #0f2640; }
        .btn-clear { background: rgba(200,50,50,0.15); color: #8b1a1a; }
        .btn-clear:active { background: rgba(200,50,50,0.25); }

        .sync-status {
            font-size: 0.9rem;
            color: #2a4b6e;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.7;
        }
        .sync-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.online { background: #22c55e; }
        .dot.offline { background: #ef4444; }

        .qr-section {
            margin-top: 28px;
            padding-top: 28px;
            border-top: 2px dashed rgba(0,0,0,0.08);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }
        .qr-section .qr-box {
            background: white;
            padding: 16px;
            border-radius: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            text-align: center;
        }
        .qr-section .qr-box img {
            width: 150px;
            height: 150px;
            display: block;
            border-radius: 8px;
        }
        .qr-section .qr-box .qr-label {
            font-size: 13px;
            color: #1a3552;
            margin-top: 8px;
            font-weight: 500;
        }
        .qr-section .qr-box .qr-label i { color: #059669; margin-right: 4px; }
        .qr-section .qr-hint {
            color: #3d5e7c;
            font-size: 0.95rem;
            line-height: 1.6;
            max-width: 280px;
        }
        .qr-section .qr-hint i { color: #1a2e4a; margin-right: 6px; }

        @media (max-width: 700px) {
            .notice-card { padding: 25px 18px; border-radius: 32px; }
            .notice-header h1 { font-size: 1.8rem; }
            #noticeContent { font-size: 1.6rem; }
            .mobile-editor textarea { font-size: 1rem; }
            .qr-section .qr-box img { width: 110px; height: 110px; }
        }
        @media (max-width: 480px) {
            .notice-header { flex-direction: column; align-items: flex-start; }
            .notice-footer { flex-direction: column; align-items: stretch; }
            .back-home { justify-content: center; }
            .mobile-editor .btn-row button { flex: 1; justify-content: center; }
            .qr-section { flex-direction: column; align-items: center; text-align: center; }
        }
    </style>
</head>
<body>

<div class="notice-card">
    <div class="notice-header">
        <h1><i class="fas fa-bullhorn"></i> 重要通报</h1>
        <div class="status-badge">
            <i class="fas fa-mobile-alt"></i>
            <span id="deviceLabel">📺 大屏端</span>
        </div>
    </div>

    <div class="notice-body">
        <div id="noticeContent">📢 加载中...</div>
    </div>

    <div class="notice-footer">
        <div class="notice-tip">
            <i class="fas fa-edit"></i>
            <span id="updateInfo">最后更新：--</span>
        </div>
        <a href="index.html" class="back-home">
            <i class="fas fa-arrow-left"></i> 返回主页
        </a>
    </div>

    <!-- 手机编辑面板 -->
    <div class="mobile-editor" id="mobileEditor">
        <h3><i class="fas fa-pen-fancy"></i> 📱 手机编辑通知</h3>
        <textarea id="editorTextarea" placeholder="输入新的通知内容..."></textarea>
        <div class="btn-row">
            <button class="btn-save" id="saveBtn"><i class="fas fa-check"></i> 发布通知</button>
            <button class="btn-clear" id="clearBtn"><i class="fas fa-undo"></i> 恢复默认</button>
        </div>
        <div class="sync-status">
            <span class="dot online" id="syncDot"></span>
            <span id="syncText">已连接 · 所有设备将自动更新</span>
        </div>
    </div>

    <!-- 二维码区域 -->
    <div class="qr-section">
        <div class="qr-box">
            <img id="qrCodeImg" 
                 src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://你的用户名.github.io/仓库名/notice.html" 
                 alt="扫码编辑通知">
            <div class="qr-label"><i class="fas fa-qrcode"></i> 扫码手机编辑</div>
        </div>
        <div class="qr-hint">
            <i class="fas fa-info-circle"></i> 手机扫描二维码即可编辑通知<br>
            <span style="font-size:0.85rem; opacity:0.7;">或直接访问本页面，手机端自动显示编辑面板</span>
        </div>
    </div>
</div>

<script>
    (function() {
        "use strict";

        // ============================================================
        //  ⚠️ 重要：请替换为你的 Supabase 配置
        //  在 https://supabase.com 注册后，在项目 Settings → API 中获取
        // ============================================================
        const SUPABASE_URL = 'https://你的项目ID.supabase.co';
        const SUPABASE_ANON_KEY = '你的anon公钥';
        // ============================================================

        // DOM 引用
        const noticeContent = document.getElementById('noticeContent');
        const updateInfo = document.getElementById('updateInfo');
        const mobileEditor = document.getElementById('mobileEditor');
        const editorTextarea = document.getElementById('editorTextarea');
        const saveBtn = document.getElementById('saveBtn');
        const clearBtn = document.getElementById('clearBtn');
        const deviceLabel = document.getElementById('deviceLabel');
        const syncDot = document.getElementById('syncDot');
        const syncText = document.getElementById('syncText');

        let supabaseClient = null;

        // ---------- 检测是否手机端 ----------
        function isMobile() {
            return /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) 
                || window.innerWidth < 768;
        }

        // ---------- 获取当前页面URL ----------
        function getCurrentPageUrl() {
            return window.location.href.split('?')[0].split('#')[0];
        }

        // ---------- 更新通知（本地显示 + 数据库存储） ----------
        function updateNoticeDisplay(text, time) {
            if (!text || text.trim() === '') return;
            const trimmed = text.trim();
            noticeContent.textContent = trimmed;
            const now = time || new Date().toLocaleString('zh-CN', { hour12: false });
            updateInfo.textContent = '最后更新：' + now;
            if (editorTextarea) {
                editorTextarea.value = trimmed;
            }
            // 本地备份
            localStorage.setItem('noticeText', trimmed);
            localStorage.setItem('noticeTime', now);
        }

        // ---------- 发布到 Supabase ----------
        async function publishToSupabase(text) {
            if (!supabaseClient) {
                throw new Error('Supabase 未初始化');
            }
            const { error } = await supabaseClient
                .from('notices')
                .insert({ content: text });
            if (error) throw error;
        }

        // ---------- 加载最新通知 ----------
        async function loadLatestNotice() {
            if (!supabaseClient) {
                // 降级：从 localStorage 读取
                const saved = localStorage.getItem('noticeText');
                if (saved) {
                    noticeContent.textContent = saved;
                    const time = localStorage.getItem('noticeTime') || '--';
                    updateInfo.textContent = '最后更新：' + time;
                    if (editorTextarea) editorTextarea.value = saved;
                }
                return;
            }
            try {
                const { data, error } = await supabaseClient
                    .from('notices')
                    .select('content, updated_at')
                    .order('id', { ascending: false })
                    .limit(1);

                if (error) throw error;
                if (data && data.length > 0) {
                    const time = new Date(data[0].updated_at).toLocaleString('zh-CN', { hour12: false });
                    updateNoticeDisplay(data[0].content, time);
                }
            } catch (e) {
                console.warn('加载通知失败:', e);
                const saved = localStorage.getItem('noticeText');
                if (saved) {
                    noticeContent.textContent = saved;
                    updateInfo.textContent = '最后更新：来自缓存';
                }
            }
        }

        // ---------- 订阅实时更新 ----------
        function subscribeToNotices() {
            if (!supabaseClient) return;
            supabaseClient
                .channel('notices-channel')
                .on(
                    'postgres_changes',
                    {
                        event: 'INSERT',
                        schema: 'public',
                        table: 'notices'
                    },
                    (payload) => {
                        const newNotice = payload.new;
                        if (newNotice && newNotice.content) {
                            const time = new Date(newNotice.updated_at).toLocaleString('zh-CN', { hour12: false });
                            updateNoticeDisplay(newNotice.content, time);
                            // 触发主页同步
                            localStorage.setItem('_notice_trigger', Date.now().toString());
                        }
                    }
                )
                .subscribe((status) => {
                    console.log('Supabase 订阅状态:', status);
                });
        }

        // ---------- 初始化 Supabase ----------
        function initSupabase() {
            try {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                syncDot.className = 'dot online';
                syncText.textContent = '已连接 · 所有设备将自动更新';
                loadLatestNotice();
                subscribeToNotices();
            } catch (e) {
                console.error('Supabase 初始化失败:', e);
                syncDot.className = 'dot offline';
                syncText.textContent = '连接失败，请检查配置';
                // 降级使用 localStorage
                const saved = localStorage.getItem('noticeText');
                if (saved) {
                    noticeContent.textContent = saved;
                    updateInfo.textContent = '最后更新：离线模式';
                }
            }
        }

        // ---------- 手机编辑功能 ----------
        function initMobileEditor() {
            const mobile = isMobile();
            if (mobile) {
                mobileEditor.classList.add('visible');
                deviceLabel.textContent = '📱 手机控制端';
            } else {
                mobileEditor.classList.remove('visible');
                deviceLabel.textContent = '📺 大屏端';
            }

            // 保存按钮
            saveBtn.addEventListener('click', async function() {
                const text = editorTextarea.value.trim();
                if (text === '') {
                    alert('请输入通知内容');
                    return;
                }

                // 先更新本地显示
                updateNoticeDisplay(text);

                // 发布到 Supabase
                try {
                    await publishToSupabase(text);
                    if (navigator.vibrate) navigator.vibrate(20);
                    const btn = this;
                    const originalText = btn.innerHTML;
                    btn.innerHTML = '<i class="fas fa-check-circle"></i> 已发布！';
                    setTimeout(() => { btn.innerHTML = originalText; }, 1500);
                    syncDot.className = 'dot online';
                    syncText.textContent = '已同步 · 所有设备将自动更新';
                } catch (e) {
                    console.error('发布失败:', e);
                    syncDot.className = 'dot offline';
                    syncText.textContent = '发布失败，将重试';
                    alert('发布失败，请检查网络后重试');
                }
            });

            // 恢复默认
            clearBtn.addEventListener('click', function() {
                if (confirm('恢复默认通知内容？')) {
                    const defaultMsg = '📢 今日正常教学，请同学们保持专注。';
                    editorTextarea.value = defaultMsg;
                    updateNoticeDisplay(defaultMsg);
                    // 也发布到数据库
                    publishToSupabase(defaultMsg).catch(console.warn);
                }
            });

            // 失去焦点自动保存（仅手机端）
            editorTextarea.addEventListener('blur', function() {
                const text = this.value.trim();
                if (text && text !== noticeContent.textContent) {
                    updateNoticeDisplay(text);
                    publishToSupabase(text).catch(console.warn);
                }
            });

            // 触屏优化
            document.addEventListener('touchstart', function(e) {
                if (e.target.tagName !== 'TEXTAREA' && !e.target.closest('.btn-row')) {
                    editorTextarea.blur();
                }
            }, { passive: true });
        }

        // ---------- 监听其他标签页更新 ----------
        window.addEventListener('storage', function(e) {
            if (e.key === 'noticeText' && e.newValue) {
                noticeContent.textContent = e.newValue;
                if (editorTextarea) editorTextarea.value = e.newValue;
                const time = localStorage.getItem('noticeTime') || '--';
                updateInfo.textContent = '最后更新：' + time;
            }
            if (e.key === '_notice_trigger') {
                loadLatestNotice();
            }
        });

        // ---------- 更新二维码 ----------
        function updateQrCode() {
            const qrImg = document.getElementById('qrCodeImg');
            const currentUrl = getCurrentPageUrl();
            if (!currentUrl.includes('localhost') && !currentUrl.match(/\d+\.\d+\.\d+\.\d+/)) {
                qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(currentUrl)}`;
            }
        }

        // ---------- 启动 ----------
        if (SUPABASE_URL !== 'https://你的项目ID.supabase.co' && SUPABASE_ANON_KEY !== '你的anon公钥') {
            initSupabase();
        } else {
            syncDot.className = 'dot offline';
            syncText.textContent = '⚠️ 请配置 Supabase';
            console.warn('⚠️ 请先在代码中配置 SUPABASE_URL 和 SUPABASE_ANON_KEY');
            // 降级使用 localStorage
            const saved = localStorage.getItem('noticeText');
            if (saved) {
                noticeContent.textContent = saved;
                updateInfo.textContent = '最后更新：本地缓存';
            }
        }

        initMobileEditor();
        updateQrCode();

        console.log('📌 重要通报页已加载 (Supabase 实时同步)');
        console.log('📱 ' + (isMobile() ? '手机模式 - 可编辑通知' : '大屏模式 - 只读显示'));

        // 暴露方法给外部
        window.updateNoticeAPI = updateNoticeDisplay;
    })();
</script>

</body>
</html>
