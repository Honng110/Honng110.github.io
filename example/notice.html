<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>通知管理 · 手机编辑</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body {
            background: linear-gradient(145deg, #f0f5fe 0%, #dce6f2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            background: rgba(255,255,255,0.60);
            backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 20px 28px;
            border: 1px solid rgba(255,255,255,0.25);
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 500;
            color: #0b1f34;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header h1 i { color: #b45309; }
        .header .badge {
            background: rgba(20,45,75,0.85);
            color: white;
            padding: 6px 18px;
            border-radius: 60px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 添加区 */
        .add-section {
            background: rgba(255,255,255,0.60);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 24px 28px;
            margin-bottom: 24px;
            border: 1px solid rgba(255,255,255,0.25);
        }
        .add-section h3 {
            font-size: 1.1rem;
            color: #0b1f34;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .add-section h3 i { color: #059669; }
        .add-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .add-row .icon-selector {
            position: relative;
            flex-shrink: 0;
        }
        .add-row .icon-selector .selected-icon {
            width: 50px;
            height: 50px;
            border-radius: 16px;
            border: 2px solid rgba(0,0,0,0.1);
            background: rgba(255,255,255,0.7);
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
        .add-row .icon-selector .selected-icon:active { transform: scale(0.92); }
        .add-row .icon-selector .dropdown {
            display: none;
            position: absolute;
            top: 56px;
            left: 0;
            background: white;
            border-radius: 20px;
            padding: 12px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
            border: 1px solid rgba(0,0,0,0.05);
            z-index: 100;
            width: 260px;
            max-height: 220px;
            overflow-y: auto;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
        }
        .add-row .icon-selector .dropdown.open {
            display: grid;
        }
        .add-row .icon-selector .dropdown .icon-option {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 2px solid transparent;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
            background: rgba(0,0,0,0.02);
        }
        .add-row .icon-selector .dropdown .icon-option:active { transform: scale(0.85); }
        .add-row .icon-selector .dropdown .icon-option.selected {
            border-color: #1a2e4a;
            background: rgba(26,46,74,0.08);
        }
        .add-row input {
            flex: 1;
            min-width: 180px;
            padding: 14px 18px;
            font-size: 1rem;
            border-radius: 20px;
            border: 2px solid rgba(0,0,0,0.1);
            background: rgba(255,255,255,0.7);
            font-family: inherit;
            transition: border-color 0.2s;
        }
        .add-row input:focus { outline: none; border-color: #1a2e4a; }
        .add-row button {
            padding: 14px 28px;
            border-radius: 20px;
            border: none;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1a2e4a;
            color: white;
            flex-shrink: 0;
        }
        .add-row button:active { transform: scale(0.94); }

        /* 列表区 */
        .list-section {
            background: rgba(255,255,255,0.60);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 24px 28px;
            border: 1px solid rgba(255,255,255,0.25);
        }
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .list-header h3 {
            font-size: 1.1rem;
            color: #0b1f34;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .list-header h3 i { color: #b45309; }
        .list-header .count {
            font-size: 0.85rem;
            color: #2a4b6e;
            opacity: 0.6;
        }
        .list-header .refresh-btn {
            background: transparent;
            border: none;
            color: #2a4b6e;
            font-size: 1rem;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 30px;
            transition: all 0.2s;
        }
        .list-header .refresh-btn:active { transform: scale(0.85); }

        .notice-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: rgba(255,255,255,0.40);
            border-radius: 20px;
            margin-bottom: 10px;
            border-left: 4px solid #b45309;
            transition: all 0.2s;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        .notice-item.inactive {
            opacity: 0.4;
            border-left-color: #999;
        }
        .notice-item .item-icon {
            font-size: 1.6rem;
            flex-shrink: 0;
            width: 40px;
            text-align: center;
        }
        .notice-item .content {
            flex: 1;
            font-size: 1rem;
            color: #0a1e32;
            word-break: break-word;
        }
        .notice-item .time {
            font-size: 0.65rem;
            color: #2a4b6e;
            opacity: 0.5;
            white-space: nowrap;
        }
        .notice-item .actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .notice-item .actions button {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            background: transparent;
            color: #2a4b6e;
        }
        .notice-item .actions button:active { transform: scale(0.85); }
        .notice-item .actions .btn-toggle { color: #059669; }
        .notice-item .actions .btn-delete { color: #dc2626; }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #2a4b6e;
            opacity: 0.5;
        }
        .empty-state i { font-size: 3rem; margin-bottom: 12px; display: block; }

        .back-row {
            margin-top: 20px;
            text-align: center;
        }
        .back-row a {
            background: rgba(255,255,255,0.5);
            color: #1a3552;
            border: 1px solid rgba(255,255,255,0.5);
            padding: 10px 28px;
            border-radius: 60px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.15s;
        }
        .back-row a:active { transform: scale(0.94); }

        .sync-status {
            font-size: 0.85rem;
            color: #2a4b6e;
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.7;
            justify-content: center;
        }
        .sync-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.online { background: #22c55e; }
        .dot.offline { background: #ef4444; }
        .dot.connecting { background: #f59e0b; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a2e4a;
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 0.95rem;
            display: none;
            z-index: 999;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            max-width: 90%;
            text-align: center;
        }
        .toast.show { display: block; }

        @media (max-width: 700px) {
            .header { padding: 16px 18px; border-radius: 28px; }
            .header h1 { font-size: 1.6rem; }
            .add-section, .list-section { padding: 16px 16px; border-radius: 24px; }
            .add-row input { font-size: 0.95rem; padding: 12px 14px; min-width: 120px; }
            .add-row button { padding: 12px 18px; font-size: 0.95rem; }
            .notice-item .content { font-size: 0.95rem; }
            .notice-item .time { display: none; }
        }
        @media (max-width: 480px) {
            .header { flex-direction: column; align-items: flex-start; }
            .add-row { flex-direction: column; }
            .add-row input { width: 100%; min-width: unset; }
            .add-row button { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><i class="fas fa-bullhorn"></i> 通知管理</h1>
        <div class="badge">
            <i class="fas fa-mobile-alt"></i>
            <span id="deviceLabel">📱 手机端</span>
        </div>
    </div>

    <!-- 添加 -->
    <div class="add-section">
        <h3><i class="fas fa-plus-circle"></i> 添加新通知</h3>
        <div class="add-row">
            <div class="icon-selector" id="iconSelector">
                <div class="selected-icon" id="selectedIcon">📢</div>
                <div class="dropdown" id="iconDropdown"></div>
            </div>
            <input type="text" id="newMessageInput" placeholder="输入新通知内容..." />
            <button id="addBtn"><i class="fas fa-check"></i> 添加</button>
        </div>
    </div>

    <!-- 列表 -->
    <div class="list-section">
        <div class="list-header">
            <h3><i class="fas fa-list"></i> 所有通知</h3>
            <div style="display:flex; align-items:center; gap:10px;">
                <span class="count" id="countLabel">共 0 条</span>
                <button class="refresh-btn" id="refreshBtn" title="手动刷新"><i class="fas fa-sync-alt"></i></button>
            </div>
        </div>
        <div id="noticeList">
            <div class="empty-state">
                <i class="fas fa-inbox"></i>
                暂无通知，添加一条吧
            </div>
        </div>
    </div>

    <div class="back-row">
        <a href="教室.html"><i class="fas fa-arrow-left"></i> 返回主页</a>
    </div>

    <div class="sync-status">
        <span class="dot connecting" id="syncDot"></span>
        <span id="syncText">连接中...</span>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    (function() {
        "use strict";

        // ============================================================
        //  ⚠️ 请替换为你的 Supabase 配置
        // ============================================================
        const SUPABASE_URL = 'https://evxxdguokbfzczswlitv.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Oh8S5zKzw5g0LK9grWT1yA_Oi7hvSdP';
        // ============================================================

        const ICONS = ['📢', '📌', '🔔', '⭐', '🎯', '📚', '📝', '✅', '⚠️', '🚨', '🎉', '💡', '🔥', '🌟', '🎓', '📖', '🏆', '💪', '🌈', '🎈', '🌸', '🍀', '🎵', '📱', '💻', '🎬', '🎮', '❤️', '💯', '✨', '👏', '🙌'];

        // DOM
        const $ = id => document.getElementById(id);
        const noticeList = $('noticeList');
        const newInput = $('newMessageInput');
        const addBtn = $('addBtn');
        const countLabel = $('countLabel');
        const syncDot = $('syncDot');
        const syncText = $('syncText');
        const toast = $('toast');
        const refreshBtn = $('refreshBtn');
        const selectedIcon = $('selectedIcon');
        const iconDropdown = $('iconDropdown');
        const deviceLabel = $('deviceLabel');

        let supabase = null;
        let notices = [];
        let currentIcon = '📢';
        let toastTimer = null;

        // ===== Toast =====
        function showToast(msg) {
            toast.textContent = msg;
            toast.className = 'toast show';
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toast.className = 'toast'; }, 2500);
        }

        // ===== 图标选择器 =====
        function initIconSelector() {
            iconDropdown.innerHTML = ICONS.map(icon => 
                `<div class="icon-option ${icon === currentIcon ? 'selected' : ''}" data-icon="${icon}">${icon}</div>`
            ).join('');

            iconDropdown.querySelectorAll('.icon-option').forEach(el => {
                el.onclick = function(e) {
                    e.stopPropagation();
                    currentIcon = this.dataset.icon;
                    selectedIcon.textContent = currentIcon;
                    iconDropdown.classList.remove('open');
                    iconDropdown.querySelectorAll('.icon-option').forEach(opt => 
                        opt.classList.toggle('selected', opt.dataset.icon === currentIcon)
                    );
                };
            });

            selectedIcon.onclick = function(e) {
                e.stopPropagation();
                iconDropdown.classList.toggle('open');
            };

            document.onclick = function() { iconDropdown.classList.remove('open'); };
        }

        // ===== 渲染列表 =====
        function renderList() {
            if (notices.length === 0) {
                noticeList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        暂无通知，添加一条吧
                    </div>
                `;
                countLabel.textContent = '共 0 条';
                return;
            }

            let html = '';
            notices.forEach((n, idx) => {
                const active = n.is_active !== false;
                const time = new Date(n.updated_at).toLocaleString('zh-CN', { hour12: false, month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                const icon = n.icon || '📢';
                html += `
                    <div class="notice-item ${active ? '' : 'inactive'}" data-id="${n.id}">
                        <div class="item-icon">${icon}</div>
                        <div class="content">${escapeHtml(n.content)}</div>
                        <div class="time">${time}</div>
                        <div class="actions">
                            <button class="btn-toggle" data-id="${n.id}" title="${active ? '隐藏' : '显示'}">
                                <i class="fas ${active ? 'fa-eye' : 'fa-eye-slash'}"></i>
                            </button>
                            <button class="btn-delete" data-id="${n.id}" title="删除">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            noticeList.innerHTML = html;
            countLabel.textContent = `共 ${notices.length} 条`;

            // 事件绑定
            noticeList.querySelectorAll('.btn-toggle').forEach(btn => {
                btn.onclick = function(e) {
                    e.stopPropagation();
                    toggleNotice(parseInt(this.dataset.id));
                };
            });

            noticeList.querySelectorAll('.btn-delete').forEach(btn => {
                btn.onclick = function(e) {
                    e.stopPropagation();
                    const id = parseInt(this.dataset.id);
                    if (confirm('确定要删除这条通知吗？')) {
                        deleteNotice(id);
                    }
                };
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== 加载 =====
        async function loadNotices() {
            if (!supabase) return;
            try {
                const { data, error } = await supabase
                    .from('notices')
                    .select('*')
                    .order('display_order', { ascending: true });

                if (error) throw error;
                notices = data || [];
                renderList();
                console.log('✅ 已加载 ' + notices.length + ' 条通知');
            } catch(e) {
                console.error('加载失败:', e);
                showToast('加载失败: ' + e.message);
            }
        }

        // ===== 添加 =====
        async function addNotice(content, icon) {
            if (!supabase) { showToast('⚠️ 未连接'); return; }
            if (!content || content.trim() === '') { showToast('请输入内容'); return; }

            try {
                const maxOrder = notices.length > 0 ? Math.max(...notices.map(n => n.display_order || 0)) : 0;
                const { error } = await supabase
                    .from('notices')
                    .insert({ 
                        content: content.trim(),
                        icon: icon || '📢',
                        is_active: true,
                        display_order: maxOrder + 10
                    });

                if (error) throw error;
                showToast('✅ 已添加');
                newInput.value = '';
                currentIcon = '📢';
                selectedIcon.textContent = '📢';
                if (navigator.vibrate) navigator.vibrate(20);
                await loadNotices();
            } catch(e) {
                console.error('添加失败:', e);
                showToast('❌ 添加失败: ' + e.message);
            }
        }

        // ===== 切换 =====
        async function toggleNotice(id) {
            if (!supabase) { showToast('⚠️ 未连接'); return; }
            const notice = notices.find(n => n.id === id);
            if (!notice) return;
            const newStatus = notice.is_active === false;
            try {
                const { error } = await supabase
                    .from('notices')
                    .update({ is_active: newStatus })
                    .eq('id', id);

                if (error) throw error;
                showToast(newStatus ? '✅ 已显示' : '⏸️ 已隐藏');
                await loadNotices();
            } catch(e) {
                console.error('切换失败:', e);
                showToast('❌ 操作失败: ' + e.message);
            }
        }

        // ===== 删除 =====
        async function deleteNotice(id) {
            if (!supabase) { showToast('⚠️ 未连接'); return; }
            try {
                console.log('🗑️ 正在删除 ID:', id);
                const { error } = await supabase
                    .from('notices')
                    .delete()
                    .eq('id', id);

                if (error) {
                    console.error('删除错误:', error);
                    throw error;
                }
                showToast('🗑️ 已删除');
                if (navigator.vibrate) navigator.vibrate(10);
                await loadNotices();
                console.log('✅ 删除成功');
            } catch(e) {
                console.error('删除失败:', e);
                showToast('❌ 删除失败: ' + e.message);
            }
        }

        // ===== Supabase =====
        function initSupabase() {
            if (SUPABASE_URL.includes('你的项目ID')) {
                syncDot.className = 'dot offline';
                syncText.textContent = '⚠️ 请配置 Supabase';
                showToast('⚠️ 请配置 Supabase');
                return;
            }

            try {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                syncDot.className = 'dot connecting';
                syncText.textContent = '🔄 连接中...';

                supabase.from('notices').select('count').limit(1)
                    .then(({ error }) => {
                        if (error) {
                            console.error('连接失败:', error);
                            syncDot.className = 'dot offline';
                            syncText.textContent = '❌ 连接失败';
                            showToast('❌ ' + error.message);
                        } else {
                            syncDot.className = 'dot online';
                            syncText.textContent = '✅ 已连接';
                            showToast('✅ 已连接');
                            loadNotices();
                            subscribeToNotices();
                        }
                    });
            } catch(e) {
                console.error('初始化失败:', e);
                syncDot.className = 'dot offline';
                syncText.textContent = '❌ 初始化失败';
            }
        }

        // ===== 订阅 =====
        function subscribeToNotices() {
            if (!supabase) return;
            supabase
                .channel('notices-channel')
                .on('postgres_changes', 
                    { event: '*', schema: 'public', table: 'notices' },
                    (payload) => {
                        console.log('📡 收到更新:', payload);
                        loadNotices();
                    }
                )
                .subscribe((status) => {
                    console.log('📡 订阅状态:', status);
                });
        }

        // ===== 事件 =====
        addBtn.onclick = function() {
            addNotice(newInput.value, currentIcon);
        };

        newInput.onkeydown = function(e) {
            if (e.key === 'Enter') addBtn.click();
        };

        refreshBtn.onclick = function() {
            loadNotices();
            showToast('🔄 已刷新');
        };

        // ===== 启动 =====
        const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
        deviceLabel.textContent = isMobile ? '📱 手机端' : '📺 大屏端';

        initIconSelector();
        initSupabase();

        console.log('📌 通知管理页面已加载 (修复版 v2)');

    })();
</script>

</body>
</html>
