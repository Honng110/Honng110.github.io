<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>通知管理 · 手机编辑</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body {
            background: linear-gradient(145deg, #f0f5fe 0%, #dce6f2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            background: rgba(255,255,255,0.60);
            backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 24px 32px;
            border: 1px solid rgba(255,255,255,0.25);
        }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 500;
            color: #0b1f34;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header h1 i { color: #b45309; }
        .header .badge {
            background: rgba(20,45,75,0.85);
            color: white;
            padding: 6px 18px;
            border-radius: 60px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header .badge i { font-size: 1.1rem; }

        /* ===== 添加新消息 ===== */
        .add-section {
            background: rgba(255,255,255,0.60);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 24px 28px;
            margin-bottom: 24px;
            border: 1px solid rgba(255,255,255,0.25);
        }
        .add-section h3 {
            font-size: 1.1rem;
            color: #0b1f34;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .add-section h3 i { color: #059669; }
        .add-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .add-row .icon-selector {
            position: relative;
            flex-shrink: 0;
        }
        .add-row .icon-selector .selected-icon {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            border: 2px solid rgba(0,0,0,0.1);
            background: rgba(255,255,255,0.7);
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
            user-select: none;
        }
        .add-row .icon-selector .selected-icon:active { transform: scale(0.92); }
        .add-row .icon-selector .selected-icon:focus { border-color: #1a2e4a; }
        .add-row .icon-selector .dropdown {
            display: none;
            position: absolute;
            top: 58px;
            left: 0;
            background: white;
            border-radius: 20px;
            padding: 12px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
            border: 1px solid rgba(0,0,0,0.05);
            z-index: 100;
            width: 280px;
            max-height: 260px;
            overflow-y: auto;
            display: none;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
        }
        .add-row .icon-selector .dropdown.open {
            display: grid;
        }
        .add-row .icon-selector .dropdown .icon-option {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: 2px solid transparent;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
            background: rgba(0,0,0,0.02);
            touch-action: manipulation;
        }
        .add-row .icon-selector .dropdown .icon-option:active { transform: scale(0.85); }
        .add-row .icon-selector .dropdown .icon-option:hover { background: rgba(0,0,0,0.05); }
        .add-row .icon-selector .dropdown .icon-option.selected {
            border-color: #1a2e4a;
            background: rgba(26,46,74,0.08);
        }
        .add-row input {
            flex: 1;
            min-width: 200px;
            padding: 14px 20px;
            font-size: 1.1rem;
            border-radius: 20px;
            border: 2px solid rgba(0,0,0,0.1);
            background: rgba(255,255,255,0.7);
            font-family: inherit;
            transition: border-color 0.2s;
        }
        .add-row input:focus { outline: none; border-color: #1a2e4a; }
        .add-row button {
            padding: 14px 32px;
            border-radius: 20px;
            border: none;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 10px;
            touch-action: manipulation;
            background: #1a2e4a;
            color: white;
            flex-shrink: 0;
        }
        .add-row button:active { transform: scale(0.94); background: #0f2640; }
        .add-row button i { font-size: 1.1rem; }

        /* ===== 消息列表 ===== */
        .list-section {
            background: rgba(255,255,255,0.60);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 24px 28px;
            border: 1px solid rgba(255,255,255,0.25);
        }
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .list-header h3 {
            font-size: 1.1rem;
            color: #0b1f34;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .list-header h3 i { color: #b45309; }
        .list-header .count {
            font-size: 0.85rem;
            color: #2a4b6e;
            opacity: 0.6;
        }
        .list-header .refresh-btn {
            background: transparent;
            border: none;
            color: #2a4b6e;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 30px;
            transition: all 0.2s;
            touch-action: manipulation;
        }
        .list-header .refresh-btn:active { transform: scale(0.85); }
        .list-header .refresh-btn:hover { background: rgba(0,0,0,0.05); }

        .notice-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            background: rgba(255,255,255,0.40);
            border-radius: 20px;
            margin-bottom: 10px;
            border-left: 4px solid #b45309;
            transition: all 0.2s;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        .notice-item.inactive {
            opacity: 0.4;
            border-left-color: #999;
        }
        .notice-item .item-icon {
            font-size: 1.8rem;
            flex-shrink: 0;
            width: 44px;
            text-align: center;
        }
        .notice-item .content {
            flex: 1;
            font-size: 1.1rem;
            color: #0a1e32;
            word-break: break-word;
        }
        .notice-item .time {
            font-size: 0.7rem;
            color: #2a4b6e;
            opacity: 0.5;
            white-space: nowrap;
        }
        .notice-item .actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .notice-item .actions button {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            touch-action: manipulation;
            background: transparent;
            color: #2a4b6e;
        }
        .notice-item .actions button:active { transform: scale(0.85); }
        .notice-item .actions .btn-toggle {
            color: #059669;
        }
        .notice-item .actions .btn-toggle:hover { background: rgba(5,150,105,0.1); }
        .notice-item .actions .btn-delete {
            color: #dc2626;
        }
        .notice-item .actions .btn-delete:hover { background: rgba(220,38,38,0.1); }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #2a4b6e;
            opacity: 0.5;
        }
        .empty-state i { font-size: 3rem; margin-bottom: 12px; display: block; }

        /* ===== 返回按钮 ===== */
        .back-row {
            margin-top: 20px;
            text-align: center;
        }
        .back-row a {
            background: rgba(255,255,255,0.5);
            color: #1a3552;
            border: 1px solid rgba(255,255,255,0.5);
            padding: 10px 28px;
            border-radius: 60px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.15s;
        }
        .back-row a:active { transform: scale(0.94); }

        /* ===== 状态 ===== */
        .sync-status {
            font-size: 0.85rem;
            color: #2a4b6e;
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.7;
            justify-content: center;
        }
        .sync-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.online { background: #22c55e; }
        .dot.offline { background: #ef4444; }
        .dot.connecting { background: #f59e0b; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a2e4a;
            color: white;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 1rem;
            display: none;
            z-index: 999;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            max-width: 90%;
            text-align: center;
        }
        .toast.show { display: block; }
        .toast.success { background: #059669; }
        .toast.error { background: #dc2626; }

        @media (max-width: 700px) {
            .header { padding: 16px 20px; border-radius: 28px; }
            .header h1 { font-size: 1.6rem; }
            .add-section, .list-section { padding: 16px 18px; border-radius: 24px; }
            .add-row input { font-size: 1rem; padding: 12px 16px; }
            .add-row button { padding: 12px 20px; font-size: 1rem; }
            .add-row .icon-selector .selected-icon { width: 44px; height: 44px; font-size: 1.4rem; }
            .notice-item .content { font-size: 1rem; }
            .notice-item .time { font-size: 0.6rem; }
            .notice-item .actions button { width: 32px; height: 32px; font-size: 0.8rem; }
            .notice-item .item-icon { font-size: 1.4rem; width: 36px; }
        }
        @media (max-width: 480px) {
            .header { flex-direction: column; align-items: flex-start; }
            .add-row { flex-direction: row; flex-wrap: wrap; }
            .add-row input { min-width: unset; width: calc(100% - 120px); }
            .add-row button { justify-content: center; }
            .notice-item { flex-wrap: wrap; }
            .notice-item .time { width: 100%; margin-left: 0; padding-left: 58px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 头部 -->
    <div class="header">
        <h1><i class="fas fa-bullhorn"></i> 通知管理</h1>
        <div class="badge">
            <i class="fas fa-mobile-alt"></i>
            <span id="deviceLabel">📱 手机端</span>
        </div>
    </div>

    <!-- 添加新消息 -->
    <div class="add-section">
        <h3><i class="fas fa-plus-circle"></i> 添加新通知</h3>
        <div class="add-row">
            <div class="icon-selector" id="iconSelector">
                <div class="selected-icon" id="selectedIcon">📢</div>
                <div class="dropdown" id="iconDropdown"></div>
            </div>
            <input type="text" id="newMessageInput" placeholder="输入新通知内容..." />
            <button id="addBtn"><i class="fas fa-check"></i> 添加</button>
        </div>
    </div>

    <!-- 消息列表 -->
    <div class="list-section">
        <div class="list-header">
            <h3><i class="fas fa-list"></i> 所有通知</h3>
            <div style="display:flex; align-items:center; gap:12px;">
                <span class="count" id="countLabel">共 0 条</span>
                <button class="refresh-btn" id="refreshBtn" title="手动刷新"><i class="fas fa-sync-alt"></i></button>
            </div>
        </div>
        <div id="noticeList">
            <div class="empty-state">
                <i class="fas fa-inbox"></i>
                暂无通知，添加一条吧
            </div>
        </div>
    </div>

    <!-- 返回 -->
    <div class="back-row">
        <a href="index.html"><i class="fas fa-arrow-left"></i> 返回主页</a>
    </div>

    <div class="sync-status">
        <span class="dot connecting" id="syncDot"></span>
        <span id="syncText">连接中...</span>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
    (function() {
        "use strict";

        // ============================================================
        //  ⚠️ 请替换为你的 Supabase 配置
        // ============================================================
        const SUPABASE_URL = 'https://evxxdguokbfzczswlitv.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Oh8S5zKzw5g0LK9grWT1yA_Oi7hvSdP';
        // ============================================================

        // 可用图标列表
        const ICONS = [
            '📢', '📌', '🔔', '⭐', '🎯', '📚', '📝', '✅',
            '⚠️', '🚨', '🎉', '💡', '🔥', '🌟', '🎓', '📖',
            '🏆', '💪', '🌈', '🎈', '🌸', '🌺', '🍀', '🎵',
            '📱', '💻', '🖥️', '⌨️', '🖨️', '📷', '🎬', '🎮'
        ];

        const DOM = {
            noticeList: document.getElementById('noticeList'),
            newMessageInput: document.getElementById('newMessageInput'),
            addBtn: document.getElementById('addBtn'),
            countLabel: document.getElementById('countLabel'),
            syncDot: document.getElementById('syncDot'),
            syncText: document.getElementById('syncText'),
            toast: document.getElementById('toast'),
            refreshBtn: document.getElementById('refreshBtn'),
            iconSelector: document.getElementById('iconSelector'),
            selectedIcon: document.getElementById('selectedIcon'),
            iconDropdown: document.getElementById('iconDropdown'),
            deviceLabel: document.getElementById('deviceLabel')
        };

        let supabaseClient = null;
        let notices = [];
        let isSubscribed = false;
        let toastTimer = null;
        let selectedIcon = '📢';

        // ===== 图标选择器 =====
        function initIconSelector() {
            // 渲染图标列表
            DOM.iconDropdown.innerHTML = ICONS.map(icon => 
                `<div class="icon-option ${icon === selectedIcon ? 'selected' : ''}" data-icon="${icon}">${icon}</div>`
            ).join('');

            // 点击选择图标
            DOM.iconDropdown.querySelectorAll('.icon-option').forEach(el => {
                el.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const icon = this.dataset.icon;
                    selectedIcon = icon;
                    DOM.selectedIcon.textContent = icon;
                    DOM.iconDropdown.classList.remove('open');
                    DOM.iconDropdown.querySelectorAll('.icon-option').forEach(opt => 
                        opt.classList.toggle('selected', opt.dataset.icon === icon)
                    );
                });
                el.addEventListener('touchstart', function(e) {
                    const icon = this.dataset.icon;
                    selectedIcon = icon;
                    DOM.selectedIcon.textContent = icon;
                    DOM.iconDropdown.classList.remove('open');
                    DOM.iconDropdown.querySelectorAll('.icon-option').forEach(opt => 
                        opt.classList.toggle('selected', opt.dataset.icon === icon)
                    );
                }, { passive: true });
            });

            // 点击切换下拉
            DOM.selectedIcon.addEventListener('click', function(e) {
                e.stopPropagation();
                DOM.iconDropdown.classList.toggle('open');
            });
            DOM.selectedIcon.addEventListener('touchstart', function(e) {
                DOM.iconDropdown.classList.toggle('open');
            }, { passive: true });

            // 点击其他地方关闭
            document.addEventListener('click', function() {
                DOM.iconDropdown.classList.remove('open');
            });
        }

        // ===== Toast =====
        function showToast(msg, type = '') {
            DOM.toast.textContent = msg;
            DOM.toast.className = 'toast show ' + type;
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { DOM.toast.className = 'toast'; }, 2500);
        }

        // ===== 渲染列表 =====
        function renderList() {
            if (notices.length === 0) {
                DOM.noticeList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        暂无通知，添加一条吧
                    </div>
                `;
                DOM.countLabel.textContent = '共 0 条';
                return;
            }

            let html = '';
            notices.forEach((n) => {
                const isActive = n.is_active !== false;
                const time = new Date(n.updated_at).toLocaleString('zh-CN', { hour12: false, month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                const icon = n.icon || '📢';
                html += `
                    <div class="notice-item ${isActive ? '' : 'inactive'}" data-id="${n.id}">
                        <div class="item-icon">${icon}</div>
                        <div class="content">${escapeHtml(n.content)}</div>
                        <div class="time">${time}</div>
                        <div class="actions">
                            <button class="btn-toggle" data-id="${n.id}" title="${isActive ? '隐藏' : '显示'}">
                                <i class="fas ${isActive ? 'fa-eye' : 'fa-eye-slash'}"></i>
                            </button>
                            <button class="btn-delete" data-id="${n.id}" title="删除">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            DOM.noticeList.innerHTML = html;
            DOM.countLabel.textContent = `共 ${notices.length} 条`;

            // 绑定事件 - 使用事件委托方式，更可靠
            DOM.noticeList.querySelectorAll('.btn-toggle').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = parseInt(this.dataset.id);
                    toggleNotice(id);
                });
            });

            DOM.noticeList.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = parseInt(this.dataset.id);
                    if (confirm('确定要删除这条通知吗？')) {
                        deleteNotice(id);
                    }
                });
            });
        }

        // ===== 防 XSS =====
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== 加载通知 =====
        async function loadNotices() {
            if (!supabaseClient) {
                console.warn('Supabase 未初始化');
                return;
            }
            try {
                const { data, error } = await supabaseClient
                    .from('notices')
                    .select('*')
                    .order('display_order', { ascending: true });

                if (error) throw error;
                notices = data || [];
                renderList();
                console.log('✅ 已加载 ' + notices.length + ' 条通知');
            } catch(e) {
                console.error('加载通知失败:', e);
                showToast('加载失败: ' + e.message, 'error');
            }
        }

        // ===== 添加通知 =====
        async function addNotice(content, icon) {
            if (!supabaseClient) {
                showToast('⚠️ 未连接，请检查配置', 'error');
                return;
            }
            if (!content || content.trim() === '') {
                showToast('请输入通知内容', 'error');
                return;
            }

            try {
                const maxOrder = notices.length > 0 ? Math.max(...notices.map(n => n.display_order || 0)) : 0;
                const { data, error } = await supabaseClient
                    .from('notices')
                    .insert({ 
                        content: content.trim(),
                        icon: icon || '📢',
                        is_active: true,
                        display_order: maxOrder + 10
                    })
                    .select();

                if (error) throw error;
                showToast('✅ 已添加', 'success');
                DOM.newMessageInput.value = '';
                // 重置图标
                selectedIcon = '📢';
                DOM.selectedIcon.textContent = '📢';
                if (navigator.vibrate) navigator.vibrate(20);
                // 重新加载列表
                await loadNotices();
            } catch(e) {
                console.error('添加失败:', e);
                showToast('❌ 添加失败: ' + e.message, 'error');
            }
        }

        // ===== 切换显示/隐藏 =====
        async function toggleNotice(id) {
            if (!supabaseClient) {
                showToast('⚠️ 未连接', 'error');
                return;
            }
            const notice = notices.find(n => n.id === id);
            if (!notice) return;
            const newStatus = notice.is_active === false;
            try {
                const { error } = await supabaseClient
                    .from('notices')
                    .update({ is_active: newStatus })
                    .eq('id', id);

                if (error) throw error;
                showToast(newStatus ? '✅ 已显示' : '⏸️ 已隐藏', 'success');
                await loadNotices();
                // 手动触发同步
                localStorage.setItem('_notice_trigger', Date.now().toString());
            } catch(e) {
                console.error('切换失败:', e);
                showToast('❌ 操作失败: ' + e.message, 'error');
            }
        }

        // ===== 删除通知（修复版） =====
        async function deleteNotice(id) {
            if (!supabaseClient) {
                showToast('⚠️ 未连接', 'error');
                return;
            }
            try {
                console.log('🗑️ 正在删除 ID:', id);
                const { error } = await supabaseClient
                    .from('notices')
                    .delete()
                    .eq('id', id);

                if (error) {
                    console.error('删除错误:', error);
                    throw error;
                }
                showToast('🗑️ 已删除', 'success');
                if (navigator.vibrate) navigator.vibrate(10);
                // 重新加载列表
                await loadNotices();
                // 手动触发同步到其他设备
                localStorage.setItem('_notice_trigger', Date.now().toString());
                console.log('✅ 删除成功，已同步');
            } catch(e) {
                console.error('删除失败:', e);
                showToast('❌ 删除失败: ' + e.message, 'error');
            }
        }

        // ===== Supabase 初始化 =====
        function initSupabase() {
            if (SUPABASE_URL.includes('你的项目ID') || SUPABASE_ANON_KEY.includes('你的anon公钥')) {
                DOM.syncDot.className = 'dot offline';
                DOM.syncText.textContent = '⚠️ 请配置 Supabase';
                showToast('⚠️ 请配置 Supabase URL 和 Key', 'error');
                return;
            }
            try {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                DOM.syncDot.className = 'dot connecting';
                DOM.syncText.textContent = '🔄 连接中...';

                // 测试连接
                supabaseClient.from('notices').select('count').limit(1)
                    .then(({ error }) => {
                        if (error) {
                            console.error('Supabase 连接失败:', error);
                            DOM.syncDot.className = 'dot offline';
                            DOM.syncText.textContent = '❌ 连接失败';
                            showToast('❌ 连接失败: ' + error.message, 'error');
                        } else {
                            DOM.syncDot.className = 'dot online';
                            DOM.syncText.textContent = '✅ 已连接';
                            showToast('✅ 已连接 Supabase', 'success');
                            loadNotices();
                            subscribeToNotices();
                        }
                    });
            } catch(e) {
                console.error('初始化失败:', e);
                DOM.syncDot.className = 'dot offline';
                DOM.syncText.textContent = '❌ 初始化失败';
                showToast('❌ 初始化失败: ' + e.message, 'error');
            }
        }

        // ===== 订阅实时更新 =====
        function subscribeToNotices() {
            if (!supabaseClient || isSubscribed) return;
            try {
                supabaseClient
                    .channel('notices-channel')
                    .on('postgres_changes', 
                        { event: '*', schema: 'public', table: 'notices' },
                        (payload) => {
                            console.log('📡 收到更新:', payload);
                            // 重新加载列表
                            loadNotices();
                        }
                    )
                    .subscribe((status) => {
                        if (status === 'SUBSCRIBED') {
                            isSubscribed = true;
                            console.log('✅ 已订阅通知更新');
                        } else if (status === 'CHANNEL_ERROR') {
                            console.warn('⚠️ 订阅出错，尝试重新订阅');
                            setTimeout(() => {
                                if (!isSubscribed) subscribeToNotices();
                            }, 3000);
                        }
                    });
            } catch(e) {
                console.error('订阅失败:', e);
            }
        }

        // ===== 监听其他标签页更新 =====
        window.addEventListener('storage', function(e) {
            if (e.key === '_notice_trigger') {
                console.log('📡 收到其他标签页同步信号');
                loadNotices();
            }
        });

        // ===== 事件绑定 =====
        DOM.addBtn.addEventListener('click', function() {
            const text = DOM.newMessageInput.value.trim();
            addNotice(text, selectedIcon);
        });

        DOM.newMessageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                DOM.addBtn.click();
            }
        });

        DOM.refreshBtn.addEventListener('click', function() {
            loadNotices();
            showToast('🔄 已刷新', 'success');
        });

        // ===== 启动 =====
        // 检测设备
        const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
        DOM.deviceLabel.textContent = isMobile ? '📱 手机端' : '📺 大屏端';

        // 初始化图标选择器
        initIconSelector();

        // 初始化 Supabase
        initSupabase();

        console.log('📌 通知管理页面已加载 (修复版)');

        // 暴露刷新方法
        window.refreshNotices = loadNotices;

    })();
</script>

</body>
</html>
