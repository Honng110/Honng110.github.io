<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>通知管理 · 手机编辑</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body {
            background: linear-gradient(145deg, #f0f5fe 0%, #dce6f2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            background: rgba(255,255,255,0.60);
            backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 24px 32px;
            border: 1px solid rgba(255,255,255,0.25);
        }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 500;
            color: #0b1f34;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header h1 i { color: #b45309; }
        .header .badge {
            background: rgba(20,45,75,0.85);
            color: white;
            padding: 6px 18px;
            border-radius: 60px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header .badge i { font-size: 1.1rem; }

        /* ===== 添加新消息 ===== */
        .add-section {
            background: rgba(255,255,255,0.60);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 24px 28px;
            margin-bottom: 24px;
            border: 1px solid rgba(255,255,255,0.25);
        }
        .add-section h3 {
            font-size: 1.1rem;
            color: #0b1f34;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .add-section h3 i { color: #059669; }
        .add-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .add-row input {
            flex: 1;
            min-width: 200px;
            padding: 14px 20px;
            font-size: 1.1rem;
            border-radius: 20px;
            border: 2px solid rgba(0,0,0,0.1);
            background: rgba(255,255,255,0.7);
            font-family: inherit;
            transition: border-color 0.2s;
        }
        .add-row input:focus { outline: none; border-color: #1a2e4a; }
        .add-row button {
            padding: 14px 32px;
            border-radius: 20px;
            border: none;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 10px;
            touch-action: manipulation;
            background: #1a2e4a;
            color: white;
        }
        .add-row button:active { transform: scale(0.94); background: #0f2640; }
        .add-row button i { font-size: 1.1rem; }

        /* ===== 消息列表 ===== */
        .list-section {
            background: rgba(255,255,255,0.60);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 24px 28px;
            border: 1px solid rgba(255,255,255,0.25);
        }
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .list-header h3 {
            font-size: 1.1rem;
            color: #0b1f34;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .list-header h3 i { color: #b45309; }
        .list-header .count {
            font-size: 0.85rem;
            color: #2a4b6e;
            opacity: 0.6;
        }

        .notice-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            background: rgba(255,255,255,0.40);
            border-radius: 20px;
            margin-bottom: 10px;
            border-left: 4px solid #b45309;
            transition: all 0.2s;
        }
        .notice-item.inactive {
            opacity: 0.4;
            border-left-color: #999;
        }
        .notice-item .content {
            flex: 1;
            font-size: 1.1rem;
            color: #0a1e32;
            word-break: break-word;
        }
        .notice-item .time {
            font-size: 0.75rem;
            color: #2a4b6e;
            opacity: 0.5;
            white-space: nowrap;
        }
        .notice-item .actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .notice-item .actions button {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            touch-action: manipulation;
            background: transparent;
            color: #2a4b6e;
        }
        .notice-item .actions button:active { transform: scale(0.85); }
        .notice-item .actions .btn-toggle {
            color: #059669;
        }
        .notice-item .actions .btn-toggle:hover { background: rgba(5,150,105,0.1); }
        .notice-item .actions .btn-delete {
            color: #dc2626;
        }
        .notice-item .actions .btn-delete:hover { background: rgba(220,38,38,0.1); }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #2a4b6e;
            opacity: 0.5;
        }
        .empty-state i { font-size: 3rem; margin-bottom: 12px; display: block; }

        /* ===== 返回按钮 ===== */
        .back-row {
            margin-top: 20px;
            text-align: center;
        }
        .back-row a {
            background: rgba(255,255,255,0.5);
            color: #1a3552;
            border: 1px solid rgba(255,255,255,0.5);
            padding: 10px 28px;
            border-radius: 60px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.15s;
        }
        .back-row a:active { transform: scale(0.94); }

        /* ===== 状态 ===== */
        .sync-status {
            font-size: 0.85rem;
            color: #2a4b6e;
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.7;
            justify-content: center;
        }
        .sync-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.online { background: #22c55e; }
        .dot.offline { background: #ef4444; }
        .dot.connecting { background: #f59e0b; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a2e4a;
            color: white;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 1rem;
            display: none;
            z-index: 999;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }
        .toast.show { display: block; }

        @media (max-width: 700px) {
            .header { padding: 16px 20px; border-radius: 28px; }
            .header h1 { font-size: 1.6rem; }
            .add-section, .list-section { padding: 16px 18px; border-radius: 24px; }
            .add-row input { font-size: 1rem; padding: 12px 16px; }
            .add-row button { padding: 12px 20px; font-size: 1rem; }
            .notice-item .content { font-size: 1rem; }
            .notice-item .time { font-size: 0.65rem; }
            .notice-item .actions button { width: 32px; height: 32px; font-size: 0.8rem; }
        }
        @media (max-width: 480px) {
            .header { flex-direction: column; align-items: flex-start; }
            .add-row { flex-direction: column; }
            .add-row input { min-width: unset; }
            .add-row button { justify-content: center; }
            .notice-item { flex-wrap: wrap; }
            .notice-item .time { width: 100%; margin-left: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 头部 -->
    <div class="header">
        <h1><i class="fas fa-bullhorn"></i> 通知管理</h1>
        <div class="badge">
            <i class="fas fa-mobile-alt"></i>
            <span id="deviceLabel">📱 手机端</span>
        </div>
    </div>

    <!-- 添加新消息 -->
    <div class="add-section">
        <h3><i class="fas fa-plus-circle"></i> 添加新通知</h3>
        <div class="add-row">
            <input type="text" id="newMessageInput" placeholder="输入新通知内容..." />
            <button id="addBtn"><i class="fas fa-check"></i> 添加</button>
        </div>
    </div>

    <!-- 消息列表 -->
    <div class="list-section">
        <div class="list-header">
            <h3><i class="fas fa-list"></i> 所有通知</h3>
            <span class="count" id="countLabel">共 0 条</span>
        </div>
        <div id="noticeList">
            <div class="empty-state">
                <i class="fas fa-inbox"></i>
                暂无通知，添加一条吧
            </div>
        </div>
    </div>

    <!-- 返回 -->
    <div class="back-row">
        <a href="index.html"><i class="fas fa-arrow-left"></i> 返回主页</a>
    </div>

    <div class="sync-status">
        <span class="dot connecting" id="syncDot"></span>
        <span id="syncText">连接中...</span>
    </div>
</div>

<!-- Toast 提示 -->
<div class="toast" id="toast"></div>

<script>
    (function() {
        "use strict";

        // ============================================================
        //  ⚠️ 请替换为你的 Supabase 配置
        // ============================================================
        const SUPABASE_URL = 'https://evxxdguokbfzczswlitv.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Oh8S5zKzw5g0LK9grWT1yA_Oi7hvSdP';
        // ============================================================

        const noticeList = document.getElementById('noticeList');
        const newMessageInput = document.getElementById('newMessageInput');
        const addBtn = document.getElementById('addBtn');
        const countLabel = document.getElementById('countLabel');
        const syncDot = document.getElementById('syncDot');
        const syncText = document.getElementById('syncText');
        const toast = document.getElementById('toast');

        let supabaseClient = null;
        let notices = [];
        let isSubscribed = false;
        let toastTimer = null;

        // ---------- Toast ----------
        function showToast(msg, duration = 2000) {
            toast.textContent = msg;
            toast.className = 'toast show';
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toast.className = 'toast'; }, duration);
        }

        // ---------- 渲染列表 ----------
        function renderList() {
            if (notices.length === 0) {
                noticeList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        暂无通知，添加一条吧
                    </div>
                `;
                countLabel.textContent = '共 0 条';
                return;
            }

            let html = '';
            notices.forEach((n, idx) => {
                const isActive = n.is_active !== false;
                const time = new Date(n.updated_at).toLocaleString('zh-CN', { hour12: false, month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                html += `
                    <div class="notice-item ${isActive ? '' : 'inactive'}" data-id="${n.id}">
                        <div class="content">${n.content}</div>
                        <div class="time">${time}</div>
                        <div class="actions">
                            <button class="btn-toggle" data-id="${n.id}" title="${isActive ? '隐藏' : '显示'}">
                                <i class="fas ${isActive ? 'fa-eye' : 'fa-eye-slash'}"></i>
                            </button>
                            <button class="btn-delete" data-id="${n.id}" title="删除">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            noticeList.innerHTML = html;
            countLabel.textContent = `共 ${notices.length} 条`;

            // 绑定事件
            document.querySelectorAll('.btn-toggle').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = parseInt(this.dataset.id);
                    toggleNotice(id);
                });
                btn.addEventListener('touchstart', function(e) {
                    const id = parseInt(this.dataset.id);
                    toggleNotice(id);
                }, { passive: true });
            });

            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = parseInt(this.dataset.id);
                    if (confirm('确定要删除这条通知吗？')) {
                        deleteNotice(id);
                    }
                });
                btn.addEventListener('touchstart', function(e) {
                    const id = parseInt(this.dataset.id);
                    if (confirm('确定要删除这条通知吗？')) {
                        deleteNotice(id);
                    }
                }, { passive: true });
            });
        }

        // ---------- 加载通知 ----------
        async function loadNotices() {
            if (!supabaseClient) return;
            try {
                const { data, error } = await supabaseClient
                    .from('notices')
                    .select('*')
                    .order('display_order', { ascending: true });

                if (error) throw error;
                notices = data || [];
                renderList();
            } catch(e) {
                console.warn('加载通知失败:', e);
                showToast('加载失败: ' + e.message);
            }
        }

        // ---------- 添加通知 ----------
        async function addNotice(content) {
            if (!supabaseClient) {
                showToast('⚠️ 未连接，请检查配置');
                return;
            }
            try {
                const maxOrder = notices.length > 0 ? Math.max(...notices.map(n => n.display_order || 0)) : 0;
                const { data, error } = await supabaseClient
                    .from('notices')
                    .insert({ 
                        content: content, 
                        is_active: true,
                        display_order: maxOrder + 10
                    })
                    .select();

                if (error) throw error;
                showToast('✅ 已添加');
                await loadNotices();
                newMessageInput.value = '';
                if (navigator.vibrate) navigator.vibrate(20);
            } catch(e) {
                console.error('添加失败:', e);
                showToast('❌ 添加失败: ' + e.message);
            }
        }

        // ---------- 切换显示/隐藏 ----------
        async function toggleNotice(id) {
            if (!supabaseClient) return;
            const notice = notices.find(n => n.id === id);
            if (!notice) return;
            const newStatus = notice.is_active === false;
            try {
                const { error } = await supabaseClient
                    .from('notices')
                    .update({ is_active: newStatus })
                    .eq('id', id);

                if (error) throw error;
                await loadNotices();
                showToast(newStatus ? '✅ 已显示' : '⏸️ 已隐藏');
            } catch(e) {
                console.error('切换失败:', e);
                showToast('❌ 操作失败');
            }
        }

        // ---------- 删除通知 ----------
        async function deleteNotice(id) {
            if (!supabaseClient) return;
            try {
                const { error } = await supabaseClient
                    .from('notices')
                    .delete()
                    .eq('id', id);

                if (error) throw error;
                await loadNotices();
                showToast('🗑️ 已删除');
                if (navigator.vibrate) navigator.vibrate(10);
            } catch(e) {
                console.error('删除失败:', e);
                showToast('❌ 删除失败');
            }
        }

        // ---------- Supabase 初始化 ----------
        function initSupabase() {
            if (SUPABASE_URL.includes('你的项目ID') || SUPABASE_ANON_KEY.includes('你的anon公钥')) {
                syncDot.className = 'dot offline';
                syncText.textContent = '⚠️ 请配置 Supabase';
                showToast('⚠️ 请配置 Supabase URL 和 Key');
                return;
            }
            try {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                syncDot.className = 'dot connecting';
                syncText.textContent = '🔄 连接中...';

                supabaseClient.from('notices').select('count').limit(1)
                    .then(({ error }) => {
                        if (error) {
                            console.error('Supabase 连接失败:', error);
                            syncDot.className = 'dot offline';
                            syncText.textContent = '❌ 连接失败';
                            showToast('❌ 连接失败: ' + error.message);
                        } else {
                            syncDot.className = 'dot online';
                            syncText.textContent = '✅ 已连接';
                            loadNotices();
                            subscribeToNotices();
                        }
                    });
            } catch(e) {
                console.error('初始化失败:', e);
                syncDot.className = 'dot offline';
                syncText.textContent = '❌ 初始化失败';
                showToast('❌ 初始化失败: ' + e.message);
            }
        }

        // ---------- 订阅 ----------
        function subscribeToNotices() {
            if (!supabaseClient || isSubscribed) return;
            supabaseClient
                .channel('notices-channel')
                .on('postgres_changes', 
                    { event: '*', schema: 'public', table: 'notices' },
                    () => {
                        loadNotices();
                    }
                )
                .subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        isSubscribed = true;
                        console.log('✅ 已订阅');
                    }
                });
        }

        // ---------- 事件绑定 ----------
        addBtn.addEventListener('click', function() {
            const text = newMessageInput.value.trim();
            if (text === '') {
                showToast('请输入通知内容');
                return;
            }
            addNotice(text);
        });

        newMessageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                addBtn.click();
            }
        });

        // ---------- 启动 ----------
        // 检测设备
        const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
        document.getElementById('deviceLabel').textContent = isMobile ? '📱 手机端' : '📺 大屏端';

        initSupabase();

        console.log('📌 通知管理页面已加载');

    })();
</script>

</body>
</html>
